name: Build TB321FU BOE mobile kernel candidate

on:
  workflow_dispatch:
  push:
    branches: [codex/tb321fu-mobile-candidate]
    paths:
      - .github/workflows/build-boe-mobile-candidate.yml
      - scripts/ci/build-boe-kernel.sh
      - scripts/ci/check-kernel-fragment.py
      - source/boe/**

concurrency:
  group: tb321fu-boe-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev kmod python3 device-tree-compiler patch curl
      - name: Build BOE2 kernel and matching modules
        env:
          BOE_KERNEL_PROFILE: mobile
        run: bash scripts/ci/build-boe-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tb321fu-boe2-mobile-kernel
          path: |
            out/boe-kernel/*.tar.gz
            out/boe-kernel/*.txt
            out/boe-kernel/kernel.config
          compression-level: 0
          if-no-files-found: error
