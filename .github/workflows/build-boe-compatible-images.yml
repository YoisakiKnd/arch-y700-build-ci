name: Build TB321FU BOE compatible images

on:
  workflow_dispatch:
  push:
    branches: [codex/tb321fu-boe]
    paths:
      - .github/workflows/build-boe-compatible-images.yml
      - scripts/ci/build-boe-kernel.sh
      - scripts/ci/repack-boe-images.sh
      - source/boe/**

concurrency:
  group: tb321fu-boe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev kmod python3 device-tree-compiler patch curl
      - name: Build BOE kernel, DTB and all modules
        run: bash scripts/ci/build-boe-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tb321fu-boe-kernel
          path: |
            out/boe-kernel/*.tar.gz
            out/boe-kernel/*.txt
            out/boe-kernel/kernel.config
          compression-level: 0
          if-no-files-found: error
  images:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full mtools dosfstools e2fsprogs kmod curl
      - name: Download existing Arch images from this fork
        uses: actions/download-artifact@v4
        with:
          name: TB321FU-archlinuxarm-plasma-aarch64-rootfs-grub
          path: input/base
          run-id: 40177430328
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: tb321fu-boe-kernel
          path: input/kernel
      - name: Install matching BOE device layer in image copies
        run: sudo bash scripts/ci/repack-boe-images.sh input/base input/kernel out/boe-images
      - uses: actions/upload-artifact@v4
        with:
          name: TB321FU-archlinuxarm-plasma-aarch64-BOE-images
          path: out/boe-images/
          compression-level: 0
          if-no-files-found: error
